/* ============================================================
   REGARD NOIR — Quiet Luxury Video Atelier
   低語不喧嘩。安靜、奢華、無邊際。
   ============================================================ */
:root{
  --noir:#191921;
  --coal:#24242a;
  --coal2:#2f2f36;
  --bone:#f5f5f3;
  --bone-dim:rgba(245,245,243,.88);
  --stone:#c9c9c6;
  --faint:#a6a6a3;
  --champagne:#e8bd5e;
  --champagne-dim:rgba(232,189,94,.42);
  --hairline:rgba(245,245,243,.2);
  --hairline-soft:rgba(245,245,243,.12);
  --veil:rgba(10,10,13,.78);
  --serif:'Cormorant Garamond','Noto Sans TC',Georgia,serif;
  --serif-tc:'Noto Sans TC','Cormorant Garamond',sans-serif;
  --sans:'Inter','Noto Sans TC',-apple-system,'PingFang TC',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
/* 深色專用，無淺色模式 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--noir);color:var(--bone);
  font-family:var(--sans);font-weight:300;
  overflow:hidden;height:100vh;width:100vw;
  -webkit-font-smoothing:antialiased;
  letter-spacing:.01em;
}
::selection{background:var(--champagne-dim)}
button{font-family:var(--sans);cursor:pointer}

/* ---------- 舞台：無邊際 ---------- */
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.05;z-index:3;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grain 8s steps(10) infinite}
@keyframes grain{
  0%,100%{transform:translate(0,0)}10%{transform:translate(-5%,-8%)}30%{transform:translate(3%,-12%)}
  50%{transform:translate(8%,4%)}70%{transform:translate(-9%,6%)}90%{transform:translate(4%,9%)}}
#veil{position:absolute;inset:0;background:var(--veil);opacity:0;pointer-events:none;z-index:40;transition:opacity .6s var(--ease)}
#veil.on{opacity:1;pointer-events:auto}

/* ---------- 頂部：耳語 ---------- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 40px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent);
  text-shadow:0 1px 12px rgba(0,0,0,.6);
}

#topbar>*{pointer-events:auto}
.wordmark{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:.42em;color:var(--bone);text-decoration:none}
.wordmark em{font-weight:300;color:var(--champagne);margin-right:.12em}
em{margin-right:.06em}
.top-actions{display:flex;align-items:center;gap:6px}
.tlink{
  background:none;border:none;color:var(--bone-dim);font-size:12px;font-weight:400;
  letter-spacing:.22em;text-transform:uppercase;padding:10px 14px;position:relative;
  transition:color .4s var(--ease);
}
.tlink:hover{color:var(--bone)}
.tlink::after{
  content:'';position:absolute;left:14px;right:14px;bottom:6px;height:1px;
  background:var(--champagne);transform:scaleX(0);transform-origin:left;
  transition:transform .5s var(--ease);
}
.tlink:hover::after{transform:scaleX(1)}
.tlink.solid{color:var(--champagne)}
#projName{
  background:none;border:none;border-bottom:1px solid transparent;
  color:var(--bone);font-family:var(--serif);font-size:17px;
  padding:6px 2px;min-width:140px;max-width:240px;outline:none;text-align:right;
  transition:border-color .4s;
}
#projName::placeholder{color:var(--faint)}
#projName:focus{border-bottom-color:var(--hairline)}

/* ---------- 底部：耳語 ---------- */
#bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:20px 40px 30px;opacity:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.5),transparent);
}

#bottombar>*{pointer-events:auto}
#bottombar{text-shadow:0 1px 10px rgba(0,0,0,.5)}

#timeline{position:relative;height:28px;cursor:pointer;margin-bottom:6px}
#tl-track{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--hairline);transform:translateY(-50%)}
#tl-fill{position:absolute;left:0;top:50%;height:1px;background:var(--bone-dim);transform:translateY(-50%);width:0%}
#tl-diamond{position:absolute;top:50%;width:7px;height:7px;background:var(--bone);
  transform:translate(-50%,-50%) rotate(45deg);transition:transform .3s var(--ease),background .3s;z-index:2}
#timeline:hover #tl-diamond{transform:translate(-50%,-50%) rotate(45deg) scale(1.5);background:var(--champagne)}
.mk-diamond{
  position:absolute;top:50%;width:8px;height:8px;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--coal2);border:1px solid var(--champagne);cursor:pointer;z-index:2;
  transition:transform .35s var(--ease),background .35s,box-shadow .35s;
}
.mk-diamond:hover{transform:translate(-50%,-50%) rotate(45deg) scale(1.7);background:var(--champagne);box-shadow:0 0 12px var(--champagne-dim)}
#transport{display:flex;align-items:center;gap:4px}
.tp-btn{
  background:none;border:none;color:var(--bone-dim);padding:10px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:color .35s,background .35s,transform .35s var(--ease);
}
.tp-btn:hover{color:var(--bone);background:rgba(237,232,220,.06);transform:scale(1.08)}
.tp-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tp-btn.main{color:var(--bone)}
.tp-btn.main svg{width:20px;height:20px}
#tc{
  font-family:var(--mono);font-size:12px;font-weight:300;color:var(--bone-dim);
  letter-spacing:.12em;margin:0 10px;cursor:text;padding:8px 6px;min-width:108px;text-align:center;
  background:none;border:none;outline:none;transition:color .3s;
}
#tc:hover,#tc:focus{color:var(--bone)}
.tp-sep{width:1px;height:18px;background:var(--hairline);margin:0 8px}
#volWrap{display:flex;align-items:center}
#volSlider{width:0;opacity:0;transition:width .45s var(--ease),opacity .45s,margin .45s;accent-color:var(--champagne);cursor:pointer;margin:0}
#volWrap:hover #volSlider{width:72px;opacity:1;margin:0 8px 0 2px}
#speedBtn{font-family:var(--mono);font-size:12px;letter-spacing:.08em;min-width:44px;border-radius:20px}
#btnMark{
  margin-left:auto;background:none;border:1px solid var(--hairline);color:var(--bone);
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:400;
  padding:13px 26px 13px 30px;border-radius:30px;transition:all .45s var(--ease);
}
#btnMark:hover{border-color:var(--champagne);color:var(--champagne);letter-spacing:.34em;padding:13px 24px 13px 30px}
#btnMark:active{transform:scale(.97)}

/* ---------- Journal：手札 ---------- */
#journalScrim{position:fixed;inset:0;z-index:60;background:var(--veil);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
#journalScrim.on{opacity:1;pointer-events:auto}
#journal{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,90vw);z-index:61;
  background:var(--coal);border-left:1px solid var(--hairline-soft);
  transform:translateX(103%);display:flex;flex-direction:column;
  box-shadow:-30px 0 80px rgba(0,0,0,.4);
}
.j-head{padding:38px 38px 24px;border-bottom:1px solid var(--hairline-soft);display:flex;align-items:baseline;justify-content:space-between}
.j-head h2{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:.06em}
.j-head h2 em{color:var(--champagne)}
.j-count{font-family:var(--mono);font-size:12px;color:var(--stone);letter-spacing:.2em}
.j-close{background:none;border:none;color:var(--stone);padding:8px;transition:color .3s,transform .4s var(--ease)}
.j-close:hover{color:var(--bone);transform:rotate(90deg)}
.j-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round}
#journalList{flex:1;overflow-y:auto;padding:10px 0;scrollbar-width:thin;scrollbar-color:var(--hairline) transparent}
.j-empty{padding:80px 38px;text-align:center;color:var(--faint);font-family:var(--serif);font-size:19px;line-height:2}
.j-item{
  padding:22px 38px;border-bottom:1px solid var(--hairline-soft);cursor:pointer;
  transition:background .4s;position:relative;
}
.j-item:hover{background:rgba(237,232,220,.025)}
.j-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--champagne);
  transform:scaleY(0);transition:transform .45s var(--ease);transform-origin:top;
}
.j-item:hover::before{transform:scaleY(1)}
.j-num{font-family:var(--serif);font-size:15px;color:var(--champagne);letter-spacing:.1em}
.j-tc{font-family:var(--mono);font-size:11px;color:var(--stone);letter-spacing:.14em;margin:6px 0 8px}
.j-note{font-size:14px;line-height:1.75;color:var(--bone);font-weight:300}
.j-meta{display:flex;align-items:center;gap:12px;margin-top:10px}
.j-cat{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--stone)}
.j-sev{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.2em;color:var(--stone)}
.j-sev i{width:6px;height:6px;border-radius:50%;display:block}
.j-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;margin-top:14px;opacity:.92}
.j-actions{position:absolute;top:20px;right:30px;display:flex;gap:2px;opacity:0;transition:opacity .3s}
.j-item:hover .j-actions{opacity:1}
.j-actions button{background:none;border:none;color:var(--faint);padding:8px;transition:color .3s}
.j-actions button:hover{color:var(--bone)}
.j-actions button.del:hover{color:#d4695e}
.j-actions svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round}

/* ---------- Atelier：標記工坊 ---------- */
#atelier{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  pointer-events:none;padding:24px;
}
#atelierCard{
  width:min(680px,94vw);max-height:92vh;overflow-y:auto;pointer-events:auto;
  background:var(--coal);border:1px solid var(--hairline-soft);
  padding:20px 32px 16px;position:relative;
  box-shadow:0 40px 120px rgba(0,0,0,.55);
  scrollbar-width:thin;
}
.a-eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--champagne);margin-bottom:8px}
.a-title{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:.02em;margin-bottom:4px}
.a-title em{color:var(--champagne)}
.a-tc{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--stone);margin-bottom:14px}
.a-shot{width:auto;max-width:100%;height:auto;max-height:320px;display:block;background:#000}
.a-shot-wrap{position:relative;width:fit-content;max-width:100%;margin:0 auto 10px}
/* 直式：左圖右表單；橫式：上圖下表單 */
.a-body{display:block}
#atelierCard.portrait{width:min(880px,94vw)}
#atelierCard.portrait .a-body{display:flex;gap:28px;align-items:flex-start}
#atelierCard.portrait .a-shot-col{flex:0 0 auto}
#atelierCard.portrait .a-form-col{flex:1;min-width:0}
#atelierCard.portrait .a-shot{max-height:560px;max-width:340px}
#atelierCard.portrait .a-shot-wrap{margin:0}
.a-shot-wrap .a-shot{margin-bottom:0}
/* ---------- 標註：獨立畫面 ---------- */
#anModal{position:fixed;inset:0;z-index:95;background:rgba(12,9,5,.94);display:flex;flex-direction:column;padding:26px 32px 22px;box-sizing:border-box}
.an-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.an-top .a-x{position:static}
.an-title{font-family:var(--serif);font-size:26px;letter-spacing:.02em}
.an-title em{color:var(--champagne)}
.an-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.an-wrap{position:relative;width:fit-content;max-width:100%;max-height:100%}
.an-wrap img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;background:#000}
#anCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.an-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.an-group{display:flex;gap:8px;align-items:center}
.an-group+.an-group{border-left:1px solid var(--hairline);padding-left:14px;margin-left:4px}
.an-sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(245,238,221,.25);cursor:pointer;padding:0;transition:transform .25s}
.an-sw.on{border-color:var(--bone);transform:scale(1.15)}
.an-actions{margin-left:auto;display:flex;gap:8px}
.an-tool{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--hairline);border-radius:50%;color:var(--bone-dim);cursor:pointer;transition:all .3s;flex:0 0 auto;padding:0}
.an-tool svg{width:18px;height:18px}
.an-tool:hover,.an-tool.on{border-color:var(--champagne);color:var(--champagne)}
.an-tool.an-done{border-color:var(--champagne);color:var(--champagne)}
.an-tool.an-done:hover{background:var(--champagne);color:#12100e}
#anCustomColor{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;border:2px dashed rgba(245,245,243,.45);background:none;padding:0;cursor:pointer}
#anCustomColor::-webkit-color-swatch-wrapper{padding:2px}
#anCustomColor::-webkit-color-swatch{border:none;border-radius:50%}
#anCustomColor::-moz-color-swatch{border:none;border-radius:50%}
#anCustomColor.on{border-style:solid;border-color:var(--bone)}
#anPx{-webkit-appearance:none;appearance:none;width:130px;height:3px;background:var(--hairline);border-radius:2px;outline:none;cursor:pointer}
#anPx::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--champagne);border:none;cursor:pointer}
#anPx::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--champagne);border:none;cursor:pointer}
.an-px{font-family:var(--mono);font-size:12px;color:var(--stone);min-width:44px}
.draw-tool{background:none;border:1px solid var(--hairline);border-radius:20px;color:var(--bone-dim);
  font-size:11px;padding:8px 18px;letter-spacing:.1em;transition:all .3s}
.draw-tool:hover,.draw-tool.on{border-color:var(--champagne);color:var(--champagne)}
.a-label{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--stone);margin:14px 0 8px}
.a-phrases{display:flex;flex-wrap:wrap;gap:8px}
.a-phrase{
  background:none;border:1px solid var(--hairline);border-radius:20px;color:var(--bone-dim);
  font-size:12px;padding:8px 16px;letter-spacing:.06em;transition:all .35s var(--ease);
}
.a-phrase:hover{border-color:var(--champagne);color:var(--champagne);transform:translateY(-1px)}
.a-seg{display:flex;border:1px solid var(--hairline);border-radius:2px;overflow:hidden}
.a-seg label{flex:1;text-align:center;padding:11px 8px;font-size:11px;letter-spacing:.22em;cursor:pointer;
  color:var(--stone);transition:all .35s;display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.a-seg label:not(:last-child){border-right:1px solid var(--hairline)}
.a-seg input{position:absolute;opacity:0;pointer-events:none}
.a-seg label:has(input:checked){background:rgba(201,168,111,.1);color:var(--champagne)}
.a-seg .dot{width:6px;height:6px;border-radius:50%}
.a-cats{display:flex;flex-wrap:wrap;gap:8px}
.a-cat input{position:absolute;opacity:0;pointer-events:none}
.a-cat span{
  display:inline-block;border:1px solid var(--hairline);border-radius:20px;padding:8px 18px;
  font-size:12px;letter-spacing:.14em;color:var(--stone);cursor:pointer;transition:all .35s var(--ease);
}
.a-cat input:checked+span{border-color:var(--champagne);color:var(--champagne)}
.a-cat span:hover{color:var(--bone);border-color:var(--bone-dim)}
.a-ref-toggle{background:none;border:none;color:var(--stone);font-size:11px;letter-spacing:.26em;
  padding:0;display:flex;align-items:center;gap:10px;transition:color .3s}
.a-ref-toggle:hover{color:var(--bone)}
.a-ref-toggle svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.4;transition:transform .4s var(--ease)}
.a-ref-toggle.open svg{transform:rotate(90deg)}
#aRefBody{overflow:hidden;height:0;opacity:0}
.a-ref-row{display:flex;gap:10px;margin-bottom:10px}
#aRefUrl{flex:1;background:none;border:none;border-bottom:1px solid var(--hairline);color:var(--bone);
  font-size:13px;padding:10px 2px;outline:none;font-family:var(--sans)}
#aRefUrl::placeholder{color:var(--faint)}
#aRefUrl:focus{border-bottom-color:var(--champagne)}
.a-ref-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline-soft);font-size:13px}
.a-ref-item a{color:var(--champagne);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-ref-item img{width:52px;height:32px;object-fit:cover}
.a-ref-item button{background:none;border:none;color:var(--faint);padding:6px}
.a-ref-item .a-ref-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--bone-dim)}
.a-ref-item button:hover{color:#d4695e}
.a-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.a-btn{
  background:none;border:none;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  padding:15px 30px;color:var(--stone);transition:all .4s var(--ease);
}
.a-btn:hover{color:var(--bone)}
.a-btn.primary{border:1px solid var(--champagne);color:var(--champagne);border-radius:30px}
.a-btn.primary:hover{background:var(--champagne);color:#12100e;letter-spacing:.36em}
.a-x{position:absolute;top:22px;right:22px;background:none;border:none;color:var(--stone);padding:10px;transition:all .4s var(--ease)}
.a-x:hover{color:var(--bone);transform:rotate(90deg)}
.a-x svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round}
#aNote{
  width:100%;background:none;border:none;border-bottom:1px solid var(--hairline);
  color:var(--bone);font-family:var(--serif);font-size:18px;font-weight:300;
  padding:8px 2px 10px;outline:none;resize:none;min-height:48px;line-height:1.6;
  transition:border-color .4s;
}
#aNote::placeholder{color:var(--faint)}
#aNote:focus{border-bottom-color:var(--champagne)}

/* ---------- 通用對話框 ---------- */
.nmodal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:24px}
.nmodal .ncard{
  width:min(460px,92vw);background:var(--coal);border:1px solid var(--hairline-soft);
  padding:40px 44px;pointer-events:auto;box-shadow:0 40px 120px rgba(0,0,0,.55);
}
.ncard h3{font-family:var(--serif);font-size:26px;font-weight:400;margin-bottom:18px;letter-spacing:.03em}
.ncard h3 em{color:var(--champagne)}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--hairline-soft);font-size:13px}
.kv span:first-child{color:var(--stone);letter-spacing:.08em}
.kv span:last-child{font-family:var(--mono);font-size:12px}
.hk-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hairline-soft);font-size:13px;color:var(--bone-dim)}
.hk-row kbd{font-family:var(--mono);font-size:11px;background:rgba(237,232,220,.06);border:1px solid var(--hairline);
  border-radius:4px;padding:4px 10px;color:var(--bone);letter-spacing:.06em}

/* ---------- Dropzone：序幕 ---------- */
#dzParticles{position:absolute;inset:0;pointer-events:none;opacity:.6}
#dropzone{
  position:fixed;inset:0;z-index:100;background:var(--noir);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
#dropzone .dz-mark{font-family:var(--serif);font-size:15px;letter-spacing:.5em;color:var(--champagne);margin-bottom:26px;text-indent:.5em}
#dropzone h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,7vw,88px);line-height:1.12;letter-spacing:.02em;margin-bottom:18px}
#dropzone h1 em{color:var(--champagne)}
#dropzone p{color:var(--stone);font-size:13px;letter-spacing:.14em;line-height:2.2;max-width:440px;margin-bottom:44px}
#dzBtn{
  background:none;border:1px solid var(--hairline);color:var(--bone);border-radius:40px;
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;padding:18px 46px 18px 52px;
  transition:all .5s var(--ease);
}
#dzBtn:hover{border-color:var(--champagne);color:var(--champagne);letter-spacing:.4em;padding:18px 42px 18px 52px}
.dz-hint{margin-top:26px;font-size:10px;letter-spacing:.24em;color:var(--faint)}
#dropzone.drag #dzBtn{border-color:var(--champagne);color:var(--champagne)}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none;
  background:var(--coal2);border:1px solid var(--hairline);color:var(--bone);
  font-size:12px;letter-spacing:.14em;padding:14px 28px;border-radius:30px;opacity:0;white-space:nowrap;
}
#confirm .ncard{text-align:center}
#confirmMsg{color:var(--bone-dim);font-size:14px;line-height:2;margin-bottom:30px;font-weight:300}
.ic{stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rg-logo{height:26px;width:auto;opacity:.95}
.dz-logo{height:84px;width:auto;margin-bottom:30px;opacity:.96}
</style>
</head>
<body>

<!-- 舞台 -->
<div id="stage">
  <video id="video" playsinline></video>
  <canvas id="grain"></canvas>
  <div id="veil"></div>

function togglePlay(){if(!video.src)return;video.paused?video.play().catch(()=>{}):video.pause();}
function syncPlayIcon(){$('#playPath').setAttribute('d',video.paused?'M7.6 4.9l11.2 7.1-11.2 7.1z':'M9 4.9v14.2M15 4.9v14.2');}

$('#tpFwd').onclick=()=>video.currentTime=Math.min(video.duration||0,video.currentTime+5);
function fmt(t){t=Math.max(0,t||0);const f=Math.floor((t%1)*detectedFps);
  const p=n=>String(n).padStart(2,'0');return `${p(Math.floor(t/3600))}:${p(Math.floor(t/60)%60)}:${p(Math.floor(t)%60)}:${p(f)}`;}
function parseTC(s){const m=s.trim().match(/^(?:(\d+):)?([0-5]?\d):([0-5]?\d)(?:[:.](\d+))?$/);if(!m)return null;
  return (+m[1]||0)*3600+(+m[2])*60+(+m[3])+(+m[4]||0)/detectedFps;}
$('#tc').addEventListener('keydown',e=>{if(e.key==='Enter'){const t=parseTC(e.target.value);if(t!=null&&video.duration)video.currentTime=Math.min(t,video.duration);e.target.blur();}});

/* FPS 偵測：用解碼幀數差分（不受顯示刷新率與掉幀影響），持續以中位數修正 */
let fpsGen=0,fpsSamples=[];
function detectFps(){
  detectedFps=30;fpsSamples=[];
  const gen=++fpsGen;
  if(!video.getVideoPlaybackQuality){
    /* 舊瀏覽器備援：rVFC 計數 */
    if(video.requestVideoFrameCallback){
      let last=0,n=0,first=0;
      const cb=(now)=>{if(gen!==fpsGen||!video.src)return;
        if(last){const d=(now-last)/1000;if(d>0.005&&d<0.2){n++;detectedFps=Math.round(n/((now-first)/1000))||30;}}
        if(!first)first=now;last=now;if(n<300)video.requestVideoFrameCallback(cb);};
      video.requestVideoFrameCallback(cb);
    }
    return;
  }
  /* 以 1000ms 跨度量測（500ms 取樣、取 2 次前的樣本當起點），避免 500ms 窗格化誤差 */
  const hist=[];
  const probe=()=>{
    if(gen!==fpsGen||!video.src)return;
    try{
      if(video.paused){hist.length=0;}
      else{
        const q=video.getVideoPlaybackQuality();
        const f=q.totalVideoFrames,now=performance.now();
        hist.push({t:now,f});
        if(hist.length>10)hist.shift();
        if(hist.length>=3){
          const ref=hist[hist.length-3];
          const fps=(f-ref.f)/((now-ref.t)/1000);
          if(fps>=5&&fps<=240){
            fpsSamples.push(fps);
            if(fpsSamples.length>30)fpsSamples.shift();
            if(fpsSamples.length>=3){
              const s=[...fpsSamples].sort((a,b)=>a-b);
              detectedFps=Math.round(s[Math.floor(s.length/2)]);
            }
          }
        }
      }
    }catch(e){}
    setTimeout(probe,500);
  };
  setTimeout(probe,500);
}
/* 鍵盤 */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  const k=e.key;
  if(k===' '){e.preventDefault();togglePlay();}
  else if(k==='j')video.currentTime-=10;
  else if(k==='l')video.currentTime+=10;
  else if(k==='k')togglePlay();
  else if(k==='ArrowLeft')video.currentTime-=5;
  else if(k==='ArrowRight')video.currentTime+=5;
  else if(k===',')video.currentTime-=1/detectedFps;
  else if(k==='.')video.currentTime+=1/detectedFps;
  else if(k==='m'||k==='M')openAtelier();
  else if(k==='Escape'){
    if($('#anModal').style.display!=='none')closeAnModal();
    else closeAll();
  }
});

  closeAnModal();closeAtelier();closeJournal();
  document.querySelectorAll('.nmodal').forEach(m=>m.style.display='none');
  $('#veil').classList.remove('on');$('#topMenu').style.display='none';
}

function captureShot(){
  if(!video.videoWidth)return null;
  try{
    const c=document.createElement('canvas');
    c.width=video.videoWidth;c.height=video.videoHeight;
    c.getContext('2d').drawImage(video,0,0);
    pendingAspect=c.width/c.height;
    return c.toDataURL('image/jpeg',.85);
  }catch(err){return null;}
}
function openAtelier(idx=-1){
  if(!video.src){toast(T('noVideo'));return;}
  video.pause();
  editIndex=idx;
  const m=idx>=0?marks[idx]:null;
  pendingT=m?m.t:video.currentTime;
  $('#aEyebrow').textContent=idx>=0?T('editMark'):T('newMark');
  $('#aTitle').innerHTML=idx>=0?T('editTitle'):T('noteTitle');
  $('#aTc').textContent=fmt(pendingT);
  pendingShot=idx>=0&&m.shot?m.shot:(captureShot()||'');
  $('#aShot').src=pendingShot;
  $('#aShot').style.display=pendingShot?'block':'none';
  $('#aDrawRow').style.display=pendingShot?'':'none';
  /* 依截圖方向切換排版：直式左圖右表單、橫式上圖下表單 */
  const _card=$('#atelierCard');
  const setOrient=()=>{const im=$('#aShot');if(im.naturalWidth)_card.classList.toggle('portrait',im.naturalHeight>im.naturalWidth);};
  if(!pendingShot)_card.classList.remove('portrait');
  else if(pendingAspect)_card.classList.toggle('portrait',pendingAspect<1);
  $('#aShot').onload=setOrient;
  setOrient();setTimeout(setOrient,300);
  $('#aNote').value=m?m.note:'';
  $('#aRefList').innerHTML='';
  (m?m.refs:[]).forEach(r=>addRefRow(r));
  $('#aRefBody').style.height='0px';$('#aRefBody').style.opacity=0;
  $('#aRefToggle').classList.remove('open');
  if(m){
    document.querySelector(`#aSev input[value="${m.sev}"]`).checked=true;
    document.querySelectorAll('#aCats input').forEach(i=>i.checked=(i.value===m.cat));
  }else{
    document.querySelector('#aSev input[value="0"]').checked=true;
    document.querySelectorAll('#aCats input').forEach(i=>i.checked=(i.value===I18N[LANG.cur].cats[5]));
  }
  closeJournal();
  $('#atelier').style.display='flex';
  $('#veil').classList.add('on');
  /* 絲滑進場 */
  gsap.fromTo('#atelierCard',{opacity:0,y:36,scale:.985},{opacity:1,y:0,scale:1,duration:.8,ease:'expo.out'});
  gsap.fromTo('#atelierCard .a-eyebrow, #atelierCard .a-title, #atelierCard .a-tc',
    {opacity:0,y:14},{opacity:1,y:0,duration:.7,stagger:.07,delay:.15,ease:'expo.out'});
  setTimeout(()=>$('#aNote').focus(),450);
}
function closeAtelier(){
  if($('#atelier').style.display==='none')return;
  gsap.to('#atelierCard',{opacity:0,y:20,scale:.99,duration:.45,ease:'expo.in',
    onComplete:()=>{$('#atelier').style.display='none';$('#veil').classList.remove('on');}});
}

const AN_TOOLS=['pen','line','rect','ellipse','arrow','eraser'];
let anColor='#c9a86f',anPx=10,anTool='pen',anStrokes=[],anCtx=null,anDrawing=false,anPreview=null;
const anCap=s=>s[0].toUpperCase()+s.slice(1);

    const b=document.createElement('button');b.className='an-sw'+(c===anColor?' on':'');

function anFit(){

  const s=Math.min(st.clientWidth/img.naturalWidth,st.clientHeight/img.naturalHeight,1);
  const w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));

}
function openAnModal(){

    anStrokes=[];anDrawing=false;anPreview=null;

}
function anPos(e){const r=$('#anCanvas').getBoundingClientRect();
  return [(e.clientX-r.left)/r.width*$('#anCanvas').width,(e.clientY-r.top)/r.height*$('#anCanvas').height];}
function drawStroke(c,s){
  c.strokeStyle=s.color;c.lineWidth=s.width;c.lineCap='round';c.lineJoin='round';
  c.globalCompositeOperation=s.erase?'destination-out':'source-over';
  const p=s.pts;
  if(s.type==='pen'){
    if(p.length<2){c.fillStyle=s.color;c.beginPath();c.arc(p[0][0],p[0][1],s.width/2,0,7);c.fill();}
    else{c.beginPath();p.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
  }else if(s.type==='line'){
    c.beginPath();c.moveTo(p[0][0],p[0][1]);c.lineTo(p[1][0],p[1][1]);c.stroke();
  }else if(s.type==='rect'){
    const x=Math.min(p[0][0],p[1][0]),y=Math.min(p[0][1],p[1][1]);
    c.strokeRect(x,y,Math.abs(p[1][0]-p[0][0]),Math.abs(p[1][1]-p[0][1]));
  }else if(s.type==='ellipse'){
    c.beginPath();
    c.ellipse((p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2,Math.abs(p[1][0]-p[0][0])/2,Math.abs(p[1][1]-p[0][1])/2,0,0,7);
    c.stroke();
  }else if(s.type==='arrow'){
    const [x0,y0]=p[0],[x1,y1]=p[1];
    const ang=Math.atan2(y1-y0,x1-x0),hl=Math.max(12,s.width*3.5);
    c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();
    c.beginPath();
    c.moveTo(x1,y1);c.lineTo(x1-hl*Math.cos(ang-Math.PI/7),y1-hl*Math.sin(ang-Math.PI/7));
    c.moveTo(x1,y1);c.lineTo(x1-hl*Math.cos(ang+Math.PI/7),y1-hl*Math.sin(ang+Math.PI/7));
    c.stroke();
  }
  c.globalCompositeOperation='source-over';
}
function anRedraw(){
  const cv=$('#anCanvas');
  anCtx.clearRect(0,0,cv.width,cv.height);
  anStrokes.forEach(s=>drawStroke(anCtx,s));
}
$('#anCanvas').addEventListener('pointerdown',e=>{
  anDrawing=true;
  const [x,y]=anPos(e);
  if(anTool==='pen'||anTool==='eraser'){
    anStrokes.push({type:'pen',pts:[[x,y]],color:anColor,width:anPx,erase:anTool==='eraser'});
  }else{
    anPreview={type:anTool,pts:[[x,y],[x,y]],color:anColor,width:anPx,erase:false};
  }
  e.target.setPointerCapture(e.pointerId);
});
$('#anCanvas').addEventListener('pointermove',e=>{
  if(!anDrawing)return;
  const [x,y]=anPos(e);
  if(anPreview){
    anPreview.pts[1]=[x,y];
    anRedraw();drawStroke(anCtx,anPreview);
  }else{
    const s=anStrokes[anStrokes.length-1];s.pts.push([x,y]);
    anCtx.strokeStyle=s.color;anCtx.lineWidth=s.width;anCtx.lineCap='round';
    anCtx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    anCtx.beginPath();
    const pr=s.pts[s.pts.length-2];anCtx.moveTo(pr[0],pr[1]);anCtx.lineTo(x,y);anCtx.stroke();
    anCtx.globalCompositeOperation='source-over';
  }
});
$('#anCanvas').addEventListener('pointerup',()=>{
  if(anPreview){
    const [[x0,y0],[x1,y1]]=anPreview.pts;
    if(Math.hypot(x1-x0,y1-y0)>3)anStrokes.push(anPreview);
    anPreview=null;anRedraw();
  }
  anDrawing=false;
});

   匯出 — 精品報告

function loadLib(src,global){
  return new Promise(res=>{
    if(window[global])return res(true);
    const s=document.createElement('script');s.src=src;
    s.onload=()=>res(!!window[global]);s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
}
async function loadPdfFonts(){
  if(window.REGARD_FONTS)return true;
  await new Promise(res=>{const s=document.createElement('script');s.src='fonts/fonts.js';
    s.onload=res;s.onerror=res;document.head.appendChild(s);});
  return !!window.REGARD_FONTS;
}
/* 截圖原始尺寸＋等比置入（匯出不拉伸） */
function shotSize(src){return new Promise(res=>{
  const im=new Image();
  im.onload=()=>res({w:im.naturalWidth||16,h:im.naturalHeight||9});
  im.onerror=()=>res({w:16,h:9});
  im.src=src;
});}
function fitBox(w,h,bw,bh){const s=Math.min(bw/w,bh/h);return{w:w*s,h:h*s};}
async function exportPdf(){
  if(!marks.length){toast(T('noVideo'));return;}
  toast('Preparing…');
  const ok=await loadLib('lib/jspdf.umd.min.js','jspdf')||await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','jspdf');
  if(!ok){toast('PDF library failed');return;}
  const fontsOK=await loadPdfFonts();
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const PW=210,PH=297,M=20,CW=PW-M*2;
  /* 配色：精品黑金 */
  const INK=[22,18,14], GOLD=[172,138,82], GREY=[120,112,98], LIGHT=[200,192,176];
  const hasCJK=s=>/[㐀-鿿豈-﫿]/.test(s);
  try{
    if(fontsOK){
      doc.addFileToVFS('NotoSans.ttf',window.REGARD_FONTS.NotoSansTC);
      doc.addFont('NotoSans.ttf','NotoSans','normal');
      doc.addFileToVFS('NotoSansB.ttf',window.REGARD_FONTS.NotoSansTCBold);
      doc.addFont('NotoSansB.ttf','NotoSans','bold');
    }
  }catch(e){}
  const sSerif=(sz)=>{try{if(fontsOK)doc.setFont('NotoSans','bold');}catch(e){}doc.setFontSize(sz);};
  const sSans=(sz)=>{try{if(fontsOK)doc.setFont('NotoSans','normal');}catch(e){}doc.setFontSize(sz);};
  let y;
  /* 封面 */
  y=70;
  try{if(window.REGARD_LOGO_B64)doc.addImage(window.REGARD_LOGO_B64,'PNG',M,y,28,28*0.93);}catch(e){}
  y+=45;
  doc.setTextColor(...GOLD);sSans(9);
  doc.text('R E G A R D',M,y);y+=12;
  const proj=$('#projName').value.trim()||'Untitled Project';
  doc.setTextColor(...INK);sSerif(28);
  const titleLines=doc.splitTextToSize(proj,CW);
  doc.text(titleLines,M,y);y+=titleLines.length*11+8;
  doc.setTextColor(...GREY);sSans(10);
  doc.text(`${marks.length} ${LANG.cur==='zh'?'則標記':'marks'} · ${new Date().toLocaleDateString(LANG.cur==='zh'?'zh-TW':'en-US')}`,M,y);
  y+=20;
  doc.setDrawColor(...GOLD);doc.setLineWidth(.6);doc.line(M,y,PW-M,y);
  /* 內頁：連續排版，一頁多則；圖片依原始比例置入 */
  const FOOT=PH-15, GAP=10;
  let pageNo=1, firstOnPage=true;
  const newMarkPage=()=>{
    doc.addPage();pageNo++;
    doc.setTextColor(...LIGHT);sSans(8);
    doc.text(`R E G A R D  —  ${proj}`,M,12);
    doc.setDrawColor(...LIGHT);doc.setLineWidth(.3);
    doc.line(M,16,PW-M,16);
    doc.line(M,FOOT,PW-M,FOOT);
    doc.text(`${pageNo}`,PW/2,PH-10,{align:'center'});
    firstOnPage=true;
    return 24;
  };
  y=newMarkPage();
  for(let i=0;i<marks.length;i++){
    const m=marks[i], num=String(i+1).padStart(2,'0');
    let sz={w:16,h:9};
    if(m.shot){try{sz=await shotSize(m.shot);}catch(e){}}
    const portrait=!!m.shot&&sz.h>=sz.w;
    const TW=portrait?CW-70:CW;
    /* 先設為渲染字體再量字，否則行數算少、渲染時超出頁面 */
    sSerif(13);
    const nl=doc.splitTextToSize(m.note||'—',TW);
    sSans(8);
    const refLines=[];
    (m.refs||[]).forEach(r=>{
      if(r.url)refLines.push(...doc.splitTextToSize(r.url,TW));
      else if(r.img)refLines.push(...doc.splitTextToSize(`${T('refImg')}${r.name?' '+r.name:''}`,TW));
    });
    const th=nl.length*6.5+6+10+(refLines.length?6+refLines.length*5:0);
    let disp={w:0,h:0}, blockH;
    if(portrait){
      disp=fitBox(sz.w,sz.h,62,110);
      blockH=Math.max(disp.h,14+th);
    }else{
      if(m.shot)disp=fitBox(sz.w,sz.h,CW,80);
      blockH=14+(disp.h?disp.h+8:0)+th;
    }
    if(y+blockH>FOOT-4)y=newMarkPage();
    const by=y;
    if(!firstOnPage){
      doc.setDrawColor(...LIGHT);doc.setLineWidth(.3);
      doc.line(M,by-GAP/2,PW-M,by-GAP/2);
    }
    if(portrait){
      /* 左圖右文 */
      try{if(m.shot)doc.addImage(m.shot,'JPEG',M,by,disp.w,disp.h);}catch(e){}
      const tx=M+70;
      let ty=by;
      doc.setTextColor(...GOLD);sSerif(16);doc.text(num,tx,ty+6);
      doc.setTextColor(...GREY);sSans(10);doc.text(m.tc,tx+14,ty+6);
      ty+=14;
      doc.setTextColor(...INK);sSerif(13);
      doc.text(nl,tx,ty);ty+=nl.length*6.5+6;
      doc.setTextColor(...GREY);sSans(9);
      doc.text(`${m.cat}   ·   ${T('sev')[m.sev]}`,tx,ty);ty+=10;
      if(refLines.length){
        doc.setTextColor(...GOLD);sSans(8);doc.text('R E F E R E N C E S',tx,ty);ty+=6;
        doc.setTextColor(...GREY);
        refLines.forEach(l=>{doc.text(l,tx,ty);ty+=5;});
      }
    }else{
      /* 上圖下文 */
      doc.setTextColor(...GOLD);sSerif(20);doc.text(num,M,by+8);
      doc.setTextColor(...GREY);sSans(10);doc.text(m.tc,M+16,by+8);
      let ty=by+14;
      if(m.shot){
        try{doc.addImage(m.shot,'JPEG',M+(CW-disp.w)/2,ty,disp.w,disp.h);}catch(e){}
        ty+=disp.h+8;
      }
      doc.setTextColor(...INK);sSerif(13);
      doc.text(nl,M,ty);ty+=nl.length*6.5+6;
      doc.setTextColor(...GREY);sSans(9);
      doc.text(`${m.cat}   ·   ${T('sev')[m.sev]}`,M,ty);ty+=10;
      if(refLines.length){
        doc.setTextColor(...GOLD);sSans(8);doc.text('R E F E R E N C E S',M,ty);ty+=6;
        doc.setTextColor(...GREY);
        refLines.forEach(l=>{doc.text(l,M,ty);ty+=5;});
      }
    }
    y=by+blockH+GAP;
    firstOnPage=false;
  }
  doc.save(`${proj}_${Date.now()}.pdf`);
  toast(T('saved'));
}
async function exportXlsx(){
  if(!marks.length){toast(T('noVideo'));return;}
  toast('Preparing…');
  const ok=await loadLib('lib/exceljs.min.js','ExcelJS')||await loadLib('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js','ExcelJS');
  if(!ok){toast('Excel library failed');return;}
  const xlsAddImg=(wb,dataURL,ext)=>{
    if(!dataURL||!String(dataURL).startsWith('data:'))return null;
    try{
      const b64=dataURL.substring(dataURL.indexOf(',')+1);
      const bin=atob(b64);const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      return wb.addImage({buffer:bytes,extension:ext});
    }catch(e){return null;}
  };
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('REGARD');
  const proj=$('#projName').value.trim()||'REGARD';
  /* Logo */
  try{
    const lid=xlsAddImg(wb,window.REGARD_LOGO_B64,'png');
    if(lid!==null)ws.addImage(lid,{tl:{col:0,row:0},ext:{width:52,height:48}});
  }catch(e){}
  /* 標題 */
  ws.getCell('B1').value=proj;
  ws.getCell('B1').font={size:18,bold:true,color:{argb:'FF171208'},name:'Calibri'};
  ws.getCell('B2').value=`${marks.length} marks · ${new Date().toLocaleDateString()}`;
  ws.getCell('B2').font={size:10,color:{argb:'FFA89A80'},name:'Calibri'};
  /* 欄位 */
  ws.columns=[
    {header:'N°',key:'n',width:8},
    {header:'Screenshot',key:'img',width:32},
    {header:'Timecode',key:'tc',width:16},
    {header:'Note',key:'note',width:48},
    {header:'Category',key:'cat',width:14},
    {header:'Severity',key:'sev',width:14},
  ];
  const hr=ws.getRow(4);
  ['N°','Screenshot','Timecode','Note','Category','Severity'].forEach((h,i)=>hr.getCell(i+1).value=h);
  hr.eachCell(c=>{
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF171208'}};
    c.font={color:{argb:'FFE3B866'},bold:true,size:11,name:'Calibri'};
    c.alignment={vertical:'middle',horizontal:'center'};
  });
  hr.height=26;
  /* 資料＋截圖 */
  for(let i=0;i<marks.length;i++){
    const m=marks[i],rn=5+i;
    const r=ws.getRow(rn);
    r.getCell(1).value=i+1;
    r.getCell(3).value=m.tc;
    r.getCell(4).value=m.note;
    r.getCell(5).value=m.cat;
    r.getCell(6).value=T('sev')[m.sev];
    r.height=72;
    r.eachCell((c,ci)=>{
      c.font={size:11,name:'Calibri',color:{argb:'FF2A251F'}};
      c.alignment={vertical:'middle',wrapText:ci===4};
      c.border={bottom:{style:'thin',color:{argb:'FFE8E0D0'}}};
      if(i%2===1)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFAF7F0'}};
    });
    r.getCell(1).font={color:{argb:'FFAC8A52'},bold:true,size:13};
    r.getCell(1).alignment={horizontal:'center'};
    r.getCell(3).font={name:'Consolas',size:10};
    if(m.shot){
      try{
        const sid=xlsAddImg(wb,m.shot,'jpeg');
        if(sid!==null){
          const sz=await shotSize(m.shot);
          const disp=fitBox(sz.w,sz.h,180,88);
          ws.addImage(sid,{tl:{col:1,row:rn-1,colOff:Math.round(4+(180-disp.w)/2)*9525,rowOff:Math.round(4+(88-disp.h)/2)*9525},ext:{width:Math.round(disp.w),height:Math.round(disp.h)}});
        }
      }catch(e){}
    }
  }
  ws.views=[{state:'frozen',ySplit:4}];
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${proj}_${Date.now()}.xlsx`;a.click();
  toast(T('saved'));
}

document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{
  b.closest('.nmodal').style.display='none';$('#veil').classList.remove('on');
});

/* ---------- 金色塵埃粒子 ---------- */
(function particles(){
  const cv=$('#dzParticles');if(!cv)return;
  const ctx=cv.getContext('2d');
  let W,H,ps=[];
  function resize(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;}
  resize();addEventListener('resize',resize);
  for(let i=0;i<70;i++)ps.push({
    x:Math.random(),y:Math.random(),
    r:Math.random()*1.8+.4,
    vx:(Math.random()-.5)*.0004,vy:(Math.random()-.5)*.0003-.0002,
    a:Math.random()*.5+.15,ph:Math.random()*Math.PI*2
  });
  let t0=0;
  function tick(t){
    if($('#dropzone').style.display==='none'){requestAnimationFrame(tick);return;}
    ctx.clearRect(0,0,W,H);
    const dt=Math.min(50,t-t0);t0=t;
    ps.forEach(p=>{
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.ph+=dt*.001;
      if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;
      const tw=p.a*(.6+.4*Math.sin(p.ph));
      ctx.beginPath();
      ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(227,184,102,${tw.toFixed(3)})`;
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ---------- 初始化 ---------- */
(function init(){
  applyLang();syncVol();syncPlayIcon();
  /* 序幕進場 */
  gsap.fromTo('#dropzone .dz-mark',{opacity:0,letterSpacing:'.8em'},{opacity:1,letterSpacing:'.5em',duration:1.4,ease:'expo.out'});
  gsap.fromTo('#dropzone h1',{opacity:0,y:40},{opacity:1,y:0,duration:1.2,delay:.2,ease:'expo.out'});
  gsap.fromTo('#dropzone p',{opacity:0,y:24},{opacity:1,y:0,duration:1,delay:.45,ease:'expo.out'});
  gsap.fromTo('#dzBtn',{opacity:0,y:20},{opacity:1,y:0,duration:1,delay:.65,ease:'expo.out'});
  gsap.fromTo('.dz-hint',{opacity:0},{opacity:1,duration:1,delay:.9});
  /* GSAP 載入失敗降級 */
  if(!window.gsap){
    document.querySelectorAll('#topbar,#bottombar').forEach(el=>el.style.opacity=1);
  }
})();
</script>
